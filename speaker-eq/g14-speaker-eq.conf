# ASUS G14 speaker EQ, local trial profile (uncalibrated microphone measurements).
# Requested bass shelf +3 dB at 150 Hz; observed 3 kHz peak reduced 3 dB.
# 3 dB headroom, stereo limiter at -1 dBFS, no automatic makeup gain.
context.properties = { log.level = 1 }
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.* = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt args = {} flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
      args = {
        node.description = "Laptop Speakers (G14 EQ)"
        media.name = "G14 Speaker EQ"
        filter.graph = {
          nodes = [
            { type = builtin name = bass_l label = bq_lowshelf control = { "Freq" = 150 "Q" = 0.707 "Gain" = 3 } }
            { type = builtin name = peak_l label = bq_peaking control = { "Freq" = 3000 "Q" = 1.2 "Gain" = -3 } }
            { type = builtin name = bass_r label = bq_lowshelf control = { "Freq" = 150 "Q" = 0.707 "Gain" = 3 } }
            { type = builtin name = peak_r label = bq_peaking control = { "Freq" = 3000 "Q" = 1.2 "Gain" = -3 } }
            { type = lv2 name = limiter
              plugin = "http://lsp-plug.in/plugins/lv2/limiter_stereo"
              control = { "alr" = 0 "boost" = 0 "g_in" = 0.70794578 "th" = 0.89125094 }
            }
          ]
          links = [
            { output = "bass_l:Out" input = "peak_l:In" }
            { output = "peak_l:Out" input = "limiter:in_l" }
            { output = "bass_r:Out" input = "peak_r:In" }
            { output = "peak_r:Out" input = "limiter:in_r" }
          ]
          inputs = [ "bass_l:In" "bass_r:In" ]
          outputs = [ "limiter:out_l" "limiter:out_r" ]
        }
        audio.channels = 2
        audio.position = [ FL FR ]
        capture.props = {
          node.name = "g14_speaker_eq"
          node.description = "Laptop Speakers (G14 EQ)"
          media.class = Audio/Sink
          node.virtual = true
          priority.session = 0
        }
        playback.props = {
          node.name = "g14_speaker_eq_output"
          node.passive = true
          target.object = "alsa_output.pci-0000_77_00.6.analog-stereo"
          node.dont-move = true
          node.dont-fallback = true
          node.linger = true
        }
      }
    }
]
